<!DOCTYPE html>
<html lang="en">

<div id="loadfail" style="display:none;position:absolute;inset:0;background:#000080;color:#fff;

<script src="js/apps/paint.js"></script>

<script src="js/apps/freecell.js"></script>
<script src="js/apps/jezzball.js"></script>

<script src="js/apps/vm.js"></script>
